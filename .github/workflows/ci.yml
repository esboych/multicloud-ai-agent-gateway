name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -c constraints.txt -e ".[dev]"
      - run: ruff check src tests examples scripts
      - run: pytest -q

  integration:
    # Black-box: real gateway processes on localhost (anonymous and
    # JWT-authenticated against a local JWKS issuer), then 10 concurrent
    # users over REST / SSE / MCP / A2A. Still no cloud access.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -c constraints.txt -e ".[dev]"
      - run: pytest -q -m integration
      - run: pytest -q -s -m load

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build gateway image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: aks/multicloud-ai-agent-gateway/Dockerfile
          push: false
          tags: multicloud-ai-agent-gateway:ci
      - name: Build chat-ui image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: aks/agent-chat-ui/Dockerfile
          push: false
          tags: agent-chat-ui:ci
