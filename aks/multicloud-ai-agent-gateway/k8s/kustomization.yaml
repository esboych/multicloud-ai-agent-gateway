apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - configmap.yaml
  - gcp-wif-credential-config.yaml
  - service.yaml
  - deployment.yaml
  # networkpolicy.yaml is intentionally NOT in this list. Apply it
  # separately on clusters that have a NetworkPolicy enforcer.
