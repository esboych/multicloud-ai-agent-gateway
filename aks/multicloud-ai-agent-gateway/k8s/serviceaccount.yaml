apiVersion: v1
kind: ServiceAccount
metadata:
  name: multicloud-ai-agent-gateway
  namespace: agent-gateway
  labels:
    app.kubernetes.io/name: multicloud-ai-agent-gateway
    azure.workload.identity/use: "true"
  annotations:
    # Reuse the existing managed identity that already has Azure AI User on
    # the Foundry project and Reader / Cost Management Reader on the target
    # subscription. Operator must also add a federated identity credential
    # on this UAMI matching subject:
    #   system:serviceaccount:agent-gateway:multicloud-ai-agent-gateway
    azure.workload.identity/client-id: "00000000-0000-0000-0000-000000000007"
automountServiceAccountToken: false
