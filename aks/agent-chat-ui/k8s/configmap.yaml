apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-chat-ui-config
  namespace: agent-gateway
  labels:
    app.kubernetes.io/name: agent-chat-ui
data:
  # In-cluster DNS to the gateway Service (port 80 -> pod 8080).
  GATEWAY_URL: http://multicloud-ai-agent-gateway.agent-gateway/
  REQUEST_TIMEOUT_SECONDS: "900"
  HEALTH_PORT: "8080"
  AUTH_SESSION_TTL_SECONDS: "28800"
  AUTH_MAX_LOGIN_ATTEMPTS: "5"
  AUTH_LOGIN_WINDOW_SECONDS: "300"
  AUTH_LOCKOUT_SECONDS: "600"
  # Behind a TLS-terminating ingress set both to "true"; see README.md.
  AUTH_COOKIE_SECURE: "false"
  TRUST_PROXY_HEADERS: "false"
